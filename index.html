<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Fold — Brand Studio</title>
  <meta name="description" content="A live generative studio for The Fold's brand: physics, morphing, type, and color." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script type="importmap">
  {
    "imports": {
      "flubber": "https://esm.sh/flubber@0.4.2",
      "animejs": "https://esm.sh/animejs@3.2.2",
      "three": "https://esm.sh/three@0.160.0",
      "paper": "https://esm.sh/paper@0.12.17"
    }
  }
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav id="topnav">
    <div class="tabs">
      <button class="tab on" data-view="studio">Studio</button>
      <button class="tab" data-view="fontlab">Type&nbsp;lab</button>
    </div>
    <span class="navmark">THE FOLD · BRAND STUDIO</span>
  </nav>

  <main id="studioView">
    <div id="stageWrap">
      <div id="stage" aria-label="Live brand preview">
        <div id="markHost"></div>
        <div id="wordmarkBar"></div>
      </div>
    </div>
    <aside id="controls"></aside>
  </main>

  <section id="fontlabView" hidden></section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
